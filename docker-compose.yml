version: '3'

services:
  db:
    image: postgres:12.5-alpine
    restart: always
    environment:
      POSTGRES_USER: unahur_desapp
      POSTGRES_PASSWORD: desarrollo
      POSTGRES_DB: unahur_desapp_dev
    ports:
      - "5432:5432"
    volumes:
      # Volumen nombrado: permite que `docker compose down -v` borre los datos.
      - postgres_data:/var/lib/postgresql/data
      # Scripts de inicialización opcionales
      - ./docker/postgres/init:/docker-entrypoint-initdb.d/
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U unahur_desapp -d unahur_desapp_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Servidor SMTP de desarrollo. La interfaz web queda en http://localhost:8025
  # y el SMTP escucha en el puerto 1025.
  # En producción se reemplaza por un proveedor SMTP real (ver .env.example).
  mailpit:
    image: axllent/mailpit
    restart: always
    ports:
      - "1025:1025"
      - "8025:8025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"

volumes:
  postgres_data:

