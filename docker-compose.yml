version: '3'

services:
  db:
    image: postgres:12.5-alpine
    restart: always
    environment:
      POSTGRES_USER: unahur_desapp
      POSTGRES_PASSWORD: desarrollo
      POSTGRES_DB: unahur_desapp_dev
    ports:
      - "5432:5432"
    volumes:
      # Carpeta de datos: se crea limpia la primera vez
      - ./docker/postgres/data:/var/lib/postgresql/data
      # Scripts de inicialización opcionales
      - ./docker/postgres/init:/docker-entrypoint-initdb.d/
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U unahur_desapp"]
      interval: 10s
      timeout: 5s
      retries: 5

