          description: >-
            Dirección actualizada. Si cambió un campo de ubicación (calle,
            altura, provincia, departamento, localidad) se re-geocodifica y
            re-valida la cobertura; si solo cambiaron alias/referencia no se
            consultan proveedores externos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaDireccion'
        '400':
          description: Calle, altura o coordenadas inválidas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaError'
        '403':
          description: Acceso denegado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaError'
        '404':
          description: Dirección no encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaError'
        '409':
          description: >-
            Iteración 1-geo: la nueva dirección coincide con varias
            ubicaciones; la respuesta incluye `opciones` para que el usuario
            elija y reintente
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  error:
                    type: string
                  opciones:
                    type: array
                    items:
                      $ref: '#/components/schemas/DireccionOpcion'
        '422':
          description: >-
            La nueva dirección no es válida para delivery (no se actualiza
            nada): no pudo ubicarse, está fuera de la zona de operación o no
            hay sucursales activas dentro de la distancia máxima
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/RespuestaError'
                  - type: object
                    description: >-
                      Iteración 5: en el rechazo por cobertura, `detalle`
                      expone la distancia de la sucursal activa más cercana.
                    properties:
                      detalle:
                        type: object
                        nullable: true
                        properties:
                          distanciaMasCercanaMetros:
                            type: number
        '503':
          description: Servicio de geolocalización o rutas no disponible temporalmente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaError'
    delete:
      tags:
        - Direcciones
      summary: Elimina una dirección (baja lógica, solo dueño)
      description: Marca activa=false.
      operationId: direccionesDestroy
      security:
        - cookieAuth: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: Dirección desactivada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaOk'
        '403':
          description: Acceso denegado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaError'
        '404':
