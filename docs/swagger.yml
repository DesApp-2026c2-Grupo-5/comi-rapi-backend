        success:
          type: boolean
          example: true
        data:
          $ref: '#/components/schemas/Categoria'
    RespuestaListaCategorias:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: array
          items:
            $ref: '#/components/schemas/Categoria'
    RespuestaProducto:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: '#/components/schemas/Producto'
    RespuestaListaProductos:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: array
          items:
            $ref: '#/components/schemas/Producto'
    RespuestaPedido:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: '#/components/schemas/Pedido'
    RespuestaListaPedidos:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: array
          items:
            $ref: '#/components/schemas/Pedido'
    RespuestaSucursal:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: '#/components/schemas/Sucursal'
    RespuestaListaSucursales:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: array
          items:
            $ref: '#/components/schemas/Sucursal'
    RespuestaDireccion:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: '#/components/schemas/Direccion'
    RespuestaListaDirecciones:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: array
          items:
            $ref: '#/components/schemas/Direccion'

  parameters:
    IdParam:
      name: id
      in: path
      required: true
      description: Identificador numérico del recurso
      schema:
        type: integer

paths:
  /health:
    get:
      tags:
        - Salud
      summary: Estado del servicio
      description: Verifica que la API esté arriba. No toca la base de datos.
      operationId: health
      responses:
        '200':
          description: Servicio disponible
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthData'

  # Iteración 3: catálogo territorial (proxy con cache de Georef) para los
  # selects en cascada, el autocompletado de calles, el aviso de cobertura y
  # el preview de direcciones. Endpoints públicos; el preview exige CSRF como
  # el resto de los POST.
  /geo/departamentos:
    get:
      tags:
        - Geo
      summary: Partidos/comunas de una provincia
      description: >-
        Departamentos de Georef: partidos en Buenos Aires, comunas en CABA.
        Cacheado del lado del backend (la data territorial es casi estática).
      operationId: geoDepartamentos
      parameters:
        - name: provincia
          in: query
          required: true
          schema:
            type: string
          description: Nombre oficial de la provincia
      responses:
        '200':
          description: Lista de departamentos
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        nombre:
                          type: string
        '400':
          description: Falta la provincia
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaError'
        '503':
          description: Georef no disponible temporalmente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaError'

  /geo/localidades:
    get:
      tags:
        - Geo
      summary: Localidades (BAHRA) de una provincia/partido
      description: >-
        Localidades de Georef (BAHRA; en CABA son los barrios), opcionalmente
        filtradas por departamento. Es la misma semántica del filtro
        `localidad` aceptado por la geocodificación.
      operationId: geoLocalidades
      parameters:
        - name: provincia
          in: query
          required: true
          schema:
            type: string
        - name: departamento
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Lista de localidades
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        nombre:
                          type: string
        '400':
          description: Falta la provincia
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaError'
        '503':
          description: Georef no disponible temporalmente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaError'

  /geo/calles:
    get:
      tags:
        - Geo
      summary: Autocompletado de calles por nombre parcial
      description: >-
        Calles de Georef por nombre parcial (mínimo 3 letras: con menos
        devuelve una lista vacía sin consultar al proveedor). Los filtros de
        provincia/departamento/localidad acotan los resultados.
      operationId: geoCalles
      parameters:
        - name: provincia
          in: query
          required: true
          schema:
            type: string
        - name: departamento
          in: query
          required: false
          schema:
            type: string
        - name: localidad
          in: query
          required: false
          schema:
            type: string
        - name: nombre
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Calles que matchean el nombre
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        nombre:
                          type: string
                        categoria:
                          type: string
                          nullable: true
                        departamento:
                          type: object
                          nullable: true
                          description: >-
                            Comuna/partido de la calle: permite DISTINGUIR
                            resultados repetidos entre comunas/partidos
                            (fix bug 3).
                          properties:
                            id:
                              type: string
                            nombre:
                              type: string
                        nomenclatura:
                          type: string
                          nullable: true
                          description: >-
                            "NOMBRE, partido/comuna, provincia" — etiqueta
                            lista para mostrar como distinguible.
        '400':
          description: Falta la provincia
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaError'
        '503':
          description: Georef no disponible temporalmente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaError'

  /geo/zonas:
    get:
      tags:
        - Geo
      summary: Zonas de operación (para el aviso de cobertura)
      description: >-
        Deriva de la MISMA configuración (cobertura-zonas) que usa la
        validación real de cobertura: el frontend muestra el aviso "fuera de
        zona" al seleccionar la provincia sin duplicar la configuración.
      operationId: geoZonas
      responses:
        '200':
          description: Zonas de operación
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        nombre:
                          type: string
                        provincias:
                          type: array
                          items:
                            type: string
                        departamentos:
                          type: array
                          items:
                            type: string

  /geo/preview:
    post:
      tags:
        - Geo
      summary: Preview de dirección (geocodifica sin persistir)
      description: >-
        Iteración 3: resuelve la dirección con Georef SIN persistir. Devuelve
        siempre 200 con el estado de la resolución: 'unica' (resultado
        normalizado + nomenclatura), 'ambigua' (opciones por identidad
        territorial, con la calle oficial para un reintento determinista) o
        'no_encontrada'. Permite resolver la ambigüedad ANTES de guardar y
        de aplicar la cobertura definitiva.
        Iteración 5: con `cobertura: true` (opt-in; solo el formulario del
        cliente lo envía) y resultado único, `data.cobertura` agrega el
        resultado de la validación REAL de cobertura (zona + sucursal activa
        a ≤5 km por ruta). Sin el flag, comportamiento previo (0 llamadas a
        ORS). El alta (POST /direcciones) sigue siendo la validación
        definitiva: nunca se confía en el preview.
      operationId: geoPreview
      security:
        - csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/DireccionRequest'
                - type: object
                  properties:
                    cobertura:
                      type: boolean
                      description: >-
                        Opt-in (iteración 5): evaluar la cobertura real de la
                        dirección resuelta. Solo para el alta del cliente.
                      example: true
      responses:
        '200':
          description: Estado de la resolución
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      estado:
                        type: string
                        enum: [unica, ambigua, no_encontrada]
                      resultado:
                        nullable: true
                        type: object
                        properties:
                          latitud:
                            type: number
                          longitud:
                            type: number
                          nomenclatura:
                            type: string
                          normalizada:
                            type: object
                            properties:
                              calle:
                                type: string
                              provincia:
                                type: string
                              departamento:
                                type: string
                                nullable: true
                              localidad:
                                type: string
                                nullable: true
                      opciones:
                        type: array
                        items:
                          $ref: '#/components/schemas/DireccionOpcion'
                      cobertura:
                        nullable: true
                        type: object
                        description: >-
                          Iteración 5: solo con `cobertura: true` y resultado
                          único. Resultado de la validación real (no lanza):
                          zona + sucursal activa más cercana a ≤5 km por ruta.
                        properties:
                          dentroZona:
                            type: boolean
                          zona:
                            type: string
                            nullable: true
                          sucursal:
                            nullable: true
                            type: object
                            description: >-
                              Sucursal activa más cercana (null si no hay
                              ninguna activa geolocalizada).
                            properties:
                              id:
                                type: integer
                              nombre:
                                type: string
                                nullable: true
                              distanciaMetros:
                                type: number
                          coberturaDisponible:
                            type: boolean
                          radioMaxKm:
                            type: number
                          mensaje:
                            type: string
        '400':
          description: Faltan calle, altura o provincia
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaError'
        '503':
          description: Georef no disponible temporalmente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaError'

  /auth/csrf-token:
    get:
      tags:
        - Autenticacion
      summary: Emite el token CSRF
      description: >
        Emite la cookie csrf-token (no httpOnly) y devuelve el token en
        data.csrfToken. Debe llamarse antes de cualquier POST/PUT/PATCH/DELETE.
      operationId: authCsrfToken
      responses:
        '200':
          description: Token CSRF emitido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsrfData'

  /auth/registro:
    post:
      tags:
        - Autenticacion
      summary: Registra un usuario y abre sesión
      operationId: authRegistro
      security:
        - csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistroRequest'
      responses:
        '201':
          description: Usuario creado y sesión iniciada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaUsuarioPublico'
        '400':
          description: Datos inválidos o email duplicado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaError'
        '403':
          description: Token CSRF inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaError'
        '429':
          description: Demasiados intentos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaError'

  /auth/login:
    post:
      tags:
        - Autenticacion
      summary: Inicia sesión
      operationId: authLogin
      security:
        - csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Sesión iniciada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaUsuarioPublico'
        '401':
          description: Credenciales inválidas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaError'
        '403':
          description: Token CSRF inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaError'
        '429':
          description: Demasiados intentos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaError'

  /auth/logout:
    post:
      tags:
        - Autenticacion
      summary: Cierra la sesión
      operationId: authLogout
      security:
        - csrfToken: []
      responses:
        '200':
          description: Sesión cerrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MensajeData'
        '403':
          description: Token CSRF inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaError'

  /auth/me:
    get:
      tags:
        - Autenticacion
      summary: Datos del usuario autenticado
      operationId: authMe
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Datos públicos del usuario en sesión
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaUsuarioPublico'
        '401':
          description: No autorizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaError'

  /usuarios:
    get:
      tags:
        - Usuarios
      summary: Lista todos los usuarios
      description: Administradores y superadministradores. Sin paginación.
      operationId: usuariosIndex
      security:
        - cookieAuth: []
      parameters:
        - name: rol
          in: query
          required: false
          schema:
            type: string
            enum:
              - CLIENTE
              - ADMINISTRADOR
              - SUPERADMINISTRADOR
          description: 'Filtra por rol (roles gestionables: CLIENTE, ADMINISTRADOR o SUPERADMINISTRADOR)'
        - name: buscar
          in: query
          required: false
          schema:
            type: string
          description: Busca por nombre, apellido o email (insensible a mayúsculas)
      responses:
        '200':
          description: Listado de usuarios
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaListaUsuarios'
        '401':
          description: No autorizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaError'
        '403':
          description: Acceso denegado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaError'
    post:
      tags:
        - Usuarios
      summary: Crea un usuario (cliente, administrador o superadmin)
      description: >-
        Solo superadministradores. Un administrador requiere sucursalId; el
        rol SUPERADMINISTRADOR es gestionable por API.
      operationId: usuariosCreate
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UsuarioCrear'
      responses:
        '201':
          description: Usuario creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaUsuario'
        '400':
          description: Datos inválidos (o email ya registrado)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaError'
        '401':
          description: No autorizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaError'
        '403':
          description: Acceso denegado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaError'

  /usuarios/{id}:
    get:
      tags:
        - Usuarios
      summary: Obtiene un usuario por id
      description: Administradores y superadministradores.
      operationId: usuariosShow
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: Usuario encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaUsuario'
        '401':
          description: No autorizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaError'
        '403':
          description: Acceso denegado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaError'
        '404':
          description: Usuario no encontrado
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
    put:
      tags:
        - Usuarios
      summary: Edita un usuario (cliente, administrador o superadmin)
      description: >-
        Solo superadministradores. No permite editar ni el rol ni la sucursal
        de la propia cuenta de SUPERADMINISTRADOR en uso. El rol
        SUPERADMINISTRADOR es gestionable por API.
      operationId: usuariosUpdate
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/IdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UsuarioActualizar'
      responses:
        '200':
          description: Usuario actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaUsuario'
        '400':
          description: Datos inválidos o conflicto de rol/sucursal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaError'
        '401':
          description: No autorizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaError'
        '403':
          description: Acceso denegado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaError'
        '404':
          description: Usuario no encontrado
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string

  /superadmin/resumen:
    get:
      tags:
        - Superadmin
      summary: Resumen global de métricas
      description: >-
        Solo SUPERADMINISTRADOR. Agregados calculados en la base (COUNT/SUM/
        GROUP BY): pedidos totales y vendidos, ventas por sucursal activa,
        pedidos por estado, la serie de los últimos 30 días y los totales de
        operación (catálogo, locales y plantel). No expone datos individuales.
      operationId: superadminResumen
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Resumen agregado del negocio
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResumenSuperadmin'
        '401':
          description: No autorizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaError'
        '403':
          description: Acceso denegado (requiere rol SUPERADMINISTRADOR)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaError'

  /categorias:
    get:
      tags:
        - Categorias
      summary: Lista categorías (público)
      description: Por defecto solo categorías activas. Con activa=false y sesión de administrador se incluyen las inactivas.
      operationId: categoriasIndex
      parameters:
        - name: activa
          in: query
          required: false
          schema:
            type: string
            enum:
              - 'false'
              - 'true'
      responses:
        '200':
          description: Listado de categorías
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaListaCategorias'
    post:
      tags:
        - Categorias
      summary: Crea una categoría (solo SUPERADMINISTRADOR)
      operationId: categoriasCreate
      security:
        - cookieAuth: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoriaRequest'
      responses:
        '201':
          description: Categoría creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaCategoria'
        '400':
          description: Nombre obligatorio o categoría duplicada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaError'
        '403':
          description: Acceso denegado o token CSRF inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaError'

  /categorias/{id}:
    get:
      tags:
        - Categorias
      summary: Obtiene una categoría por id
      operationId: categoriasShow
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: Categoría encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaCategoria'
        '404':
          description: Categoría no encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaError'
    put:
      tags:
        - Categorias
      summary: Actualiza una categoría (solo SUPERADMINISTRADOR)
      operationId: categoriasUpdate
      security:
        - cookieAuth: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/IdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoriaRequest'
      responses:
        '200':
          description: Categoría actualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaCategoria'
        '400':
          description: Nombre vacío o duplicado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaError'
        '404':
          description: Categoría no encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaError'
    delete:
      tags:
        - Categorias
      summary: Elimina una categoría (baja lógica, solo SUPERADMINISTRADOR)
      description: Marca activa=false.
      operationId: categoriasDestroy
      security:
        - cookieAuth: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
