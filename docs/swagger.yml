openapi: 3.0.0
info:
  title: Comi-Rapi API
  description: |-
    API REST de **Comi-Rapi**. Autenticación por sesión server-side (cookie
    HttpOnly `comirapi.sid`) + protección CSRF por doble envío de cookie y
    header.

    ### Credenciales de prueba (seed)

    | Rol | Email | Contraseña |
    |---|---|---|
    | SUPERADMINISTRADOR | `superadmin@test.com` | `123456` |
    | ADMINISTRADOR | `admin@test.com` | `123456` |
    | CLIENTE | `cliente@test.com` | `123456` |

    ### Roles y alcance

    - **SUPERADMINISTRADOR**: métricas globales (`/api/superadmin/resumen`),
      gestión de usuarios y CRUD de sucursales (decisión corporativa).
    - **ADMINISTRADOR**: gestiona categorías, productos e imágenes, y avanza
      los pedidos (preparación, envío, entrega) de su sucursal asignada.
    - **CLIENTE**: registra pedidos, confirma o cancela los propios, administra
      sus direcciones y consulta sus pedidos.
    - **Sin sesión**: solo acceso al catálogo público (GET de categorías,
      productos y sucursales activas), a `/api/geo/*` (catálogo territorial,
      zonas y preview — iteración 3) y a `/api/auth/*`.

    ### Cómo probar desde Swagger UI

    1. `GET /api/auth/csrf-token` → copiar `data.csrfToken` de la respuesta.
    2. Botón **Authorize** → esquema `csrfToken` → pegar el token y autorizar.
    3. `POST /api/auth/login` con las credenciales del rol a probar.
    4. Ejecutar los endpoints deseados (los 🔒 quedan autorizados).

    ### Convenciones

    - **CSRF**: todo POST/PUT/PATCH/DELETE (incluidos los públicos) exige el
      header `x-csrf-token` con el mismo valor de la cookie `csrf-token`.
      Un `403 "Solicitud no válida"` indica desincronización: generar un token
      nuevo y repetir el paso 2.
    - **Respuestas**: éxito `{ success: true, data }`; error
      `{ success: false, error }`. Única excepción: `/api/usuarios`
      (`{ data }` / `{ message }`).
    - **No implementado**: el módulo `/api/personalizacion` no tiene endpoints
      reales.
  version: 1.1.0
servers:
  - url: http://localhost:3000/api
    description: Backend en desarrollo (Express + Sequelize)
tags:
  - name: Salud
    description: Endpoint de verificación de conexión
  - name: Autenticacion
    description: Registro, login, logout y sesión
  - name: Usuarios
    description: Usuarios (lectura para admin y superadmin; alta/edición solo superadmin)
  - name: Superadmin
    description: >-
      Panel del SUPERADMINISTRADOR: métricas agregadas de todo el negocio
      (pedidos, ventas por sucursal, serie de 30 días y operación)
  - name: Categorias
    description: ABM de categorías de productos
  - name: Productos
    description: ABM de productos
  - name: Pedidos
    description: Registración, consulta y cambios de estado de pedidos
  - name: Sucursales
    description: ABM de sucursales
  - name: Direcciones
    description: CRUD de direcciones del cliente
  - name: Geo
    description: >-
      Iteración 3 — catálogo territorial (proxy con cache de Georef),
      zonas de operación y preview de direcciones (públicos)
  - name: Imagenes
    description: Subida de imágenes (productos y categorías)
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: comirapi.sid
      description: Cookie de sesión emitida por POST /api/auth/registro o /api/auth/login
    csrfToken:
      type: apiKey
      in: header
      name: x-csrf-token
      description: Token antiforgery emitido por GET /api/auth/csrf-token (necesario en todo POST/PUT/PATCH/DELETE)
  schemas:
    RespuestaOk:
      type: object
      properties:
        success:
          type: boolean
          example: true
    RespuestaError:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: string
    RolUsuario:
      type: string
      enum:
        - CLIENTE
        - ADMINISTRADOR
        - SUPERADMINISTRADOR
    TipoProducto:
      type: string
      enum:
        - PRODUCTO
        - COMBO
    MedioPago:
      type: string
      enum:
        - MERCADO_PAGO
        - TARJETA
    EstadoPedidoEnum:
      type: string
      enum:
        - pendiente
        - confirmado
        - en_preparacion
        - listo_para_entregar
        - en_camino
        - entregado
        - cancelado

    UsuarioPublico:
      type: object
      description: Datos públicos del usuario (sin password)
      properties:
        id:
          type: integer
        nombre:
          type: string
        apellido:
          type: string
          nullable: true
        email:
          type: string
        telefono:
          type: string
          nullable: true
        rol:
          $ref: '#/components/schemas/RolUsuario'
        activo:
          type: boolean
        fechaNacimiento:
          type: string
          format: date
          nullable: true

    Usuario:
      type: object
      description: Usuario completo sin password (respuesta de /api/usuarios)
      properties:
        id:
          type: integer
        nombre:
          type: string
        apellido:
          type: string
          nullable: true
        email:
          type: string
        telefono:
          type: string
          nullable: true
        rol:
          $ref: '#/components/schemas/RolUsuario'
        activo:
          type: boolean
        fechaNacimiento:
          type: string
          format: date
          nullable: true
        edad:
          type: integer
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    UsuarioCrear:
      type: object
      description: Alta de usuario desde el panel (solo SUPERADMINISTRADOR)
      required:
        - nombre
        - email
        - password
        - rol
      properties:
        nombre:
          type: string
        apellido:
          type: string
          nullable: true
        email:
          type: string
        telefono:
          type: string
          nullable: true
        password:
          type: string
          format: password
        rol:
          $ref: '#/components/schemas/RolUsuario'
        sucursalId:
          type: integer
          nullable: true
          description: Obligatoria si rol = ADMINISTRADOR
        activo:
          type: boolean
          default: true

    UsuarioActualizar:
      type: object
      description: Edición de usuario desde el panel (solo SUPERADMINISTRADOR; campos parciales)
      properties:
        nombre:
          type: string
        apellido:
          type: string
          nullable: true
        email:
          type: string
        telefono:
          type: string
          nullable: true
        password:
          type: string
          format: password
          description: Solo si se quiere cambiarla
        rol:
          $ref: '#/components/schemas/RolUsuario'
        sucursalId:
          type: integer
          nullable: true
          description: Obligatoria si rol = ADMINISTRADOR
        activo:
          type: boolean

    ResumenSuperadmin:
      type: object
      description: Métricas agregadas del panel del SUPERADMINISTRADOR
      properties:
        pedidos:
          type: object
          properties:
            total:
              type: integer
              description: Todos los pedidos, cualquier estado
            vendidos:
              type: integer
              description: Pedidos sin contar pendientes ni cancelados
            pendientes:
              type: integer
            ingresos:
              type: number
              description: Suma de total de los pedidos vendidos
        porEstado:
          type: array
          items:
            type: object
            properties:
              estado:
                type: string
                description: Nombre del EstadoPedido (ej. entregado)
              cantidad:
                type: integer
              ingresos:
                type: number
                description: 0 para pendiente/cancelado
        porSucursal:
          type: array
          description: Solo sucursales activas; las sin ventas van en 0
          items:
            type: object
            properties:
              sucursalId:
                type: integer
              sucursal:
                type: string
                description: Nombre de la sucursal
              cantidad:
                type: integer
              ingresos:
                type: number
        porDia:
          type: array
          description: Serie de los últimos 30 días (solo ventas), fecha local YYYY-MM-DD
          items:
            type: object
            properties:
              dia:
                type: string
                format: date
              cantidad:
                type: integer
              ingresos:
                type: number
        operacion:
          type: object
          description: Totales de catálogo, locales y plantel
          properties:
            categorias:
              type: integer
            productos:
              type: integer
            combos:
              type: integer
            promocionesActivas:
              type: integer
            sucursalesActivas:
              type: integer
            clientes:
              type: integer
            administradores:
              type: integer

    Categoria:
      type: object
      properties:
        id:
          type: integer
        nombre:
          type: string
        descripcion:
          type: string
          nullable: true
        imagen:
          type: string
          nullable: true
        activa:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Producto:
      type: object
      properties:
        id:
          type: integer
        nombre:
          type: string
        precio:
          type: number
          format: double
        categoria:
          type: string
          nullable: true
        categoriaId:
          type: integer
        imagen:
          type: string
          nullable: true
        descripcion:
          type: string
          nullable: true
        activo:
          type: boolean
        tipo:
          $ref: '#/components/schemas/TipoProducto'

    Sucursal:
      type: object
      properties:
        id:
          type: integer
        nombre:
          type: string
        direccion:
          type: string
        latitud:
          type: number
          format: double
          nullable: true
        longitud:
          type: number
          format: double
          nullable: true
        telefono:
          type: string
          nullable: true
        horarios:
          type: string
          nullable: true
        activa:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    # Iteración 1-geo (direcciones y geolocalización): se agrega
    # `departamento` (partido/comuna según Georef) y `nomenclatura`
    # (dirección completa normalizada por Georef); `localidad` y
    # `codigoPostal` pasan a ser opcionales (el backend determina la
    # localidad y Georef no provee el CP). Se corrige además `ciudad` →
    # `provincia`/`localidad`, alineado con el DER actual.
    Direccion:
      type: object
      properties:
        id:
          type: integer
        usuarioId:
          type: integer
        sucursalId:
          type: integer
          nullable: true
        calle:
          type: string
        altura:
          type: integer
        provincia:
          type: string
        departamento:
          type: string
          nullable: true
        localidad:
          type: string
          nullable: true
        codigoPostal:
          type: string
          nullable: true
        nomenclatura:
          type: string
          nullable: true
        referencia:
          type: string
          nullable: true
        latitud:
          type: number
          format: double
          nullable: true
        longitud:
          type: number
          format: double
          nullable: true
        alias:
          type: string
          nullable: true
        activa:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ClienteResumen:
      type: object
      properties:
        id:
          type: integer
        nombre:
          type: string
        apellido:
          type: string
          nullable: true
        email:
          type: string

    EstadoPedido:
      type: object
      properties:
        id:
          type: integer
        nombre:
          type: string
        orden:
          type: integer
        esInicial:
          type: boolean
        esFinal:
          type: boolean
        activo:
          type: boolean

    ProductoResumen:
      type: object
      properties:
        id:
          type: integer
        nombre:
          type: string
        precio:
          type: number
          format: double

    PedidoItem:
      type: object
      properties:
        id:
          type: integer
        pedidoId:
          type: integer
        productoId:
          type: integer
          nullable: true
        nombreProducto:
          type: string
        precioUnitario:
          type: number
          format: double
        cantidad:
          type: integer
        subtotal:
          type: number
          format: double
        observacion:
          type: string
          nullable: true
        Producto:
          $ref: '#/components/schemas/ProductoResumen'
          nullable: true

    PedidoEstadoHistorial:
      type: object
      properties:
        id:
          type: integer
        pedidoId:
          type: integer
        estadoId:
          type: integer
        usuarioId:
          type: integer
          nullable: true
        fechaHora:
          type: string
          format: date-time
        observacion:
          type: string
          nullable: true
        EstadoPedido:
          $ref: '#/components/schemas/EstadoPedido'

    Pedido:
      type: object
      description: Pedido serializado (con cliente, sucursal, estado e histórico)
      properties:
        id:
          type: integer
        usuarioId:
          type: integer
        sucursalId:
          type: integer
        estadoId:
          type: integer
        fechaHora:
          type: string
          format: date-time
        costoEnvio:
          type: number
          format: double
        total:
          type: number
          format: double
        medioPago:
          $ref: '#/components/schemas/MedioPago'
          nullable: true
        observacion:
          type: string
          nullable: true
        calle:
          type: string
          nullable: true
        altura:
          type: integer
          nullable: true
        ciudad:
          type: string
          nullable: true
        codigoPostal:
          type: string
          nullable: true
        referencia:
          type: string
          nullable: true
        latitud:
          type: number
          format: double
          nullable: true
        longitud:
          type: number
          format: double
          nullable: true
        etaMinutos:
          type: integer
          nullable: true
          description: >-
            T2: tiempo estimado de entrega en minutos
            (cocina 30 + viaje por ruta ORS). NULL si ORS falló o si el
            pedido aún no fue confirmado.
        etaCalculadoEn:
          type: string
          format: date-time
          nullable: true
          description: >-
            T2: timestamp del cálculo — base para mostrar "llegada ~HH:MM".
        estado:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        cliente:
          $ref: '#/components/schemas/ClienteResumen'
        sucursal:
          $ref: '#/components/schemas/Sucursal'
        estadoActual:
          $ref: '#/components/schemas/EstadoPedido'
        items:
          type: array
          items:
            $ref: '#/components/schemas/PedidoItem'
        historial:
          type: array
          items:
            $ref: '#/components/schemas/PedidoEstadoHistorial'

    # ---------- Requests ----------
    RegistroRequest:
      type: object
      required:
        - email
        - password
        - nombre
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 6
          description: Mínimo 6 caracteres
        nombre:
          type: string
        apellido:
          type: string
        telefono:
          type: string
        rol:
          $ref: '#/components/schemas/RolUsuario'
          description: Opcional, por defecto CLIENTE
        fechaNacimiento:
          type: string
          format: date
          description: Formato YYYY-MM-DD (opcional)
      example:
        email: nuevo.cliente@test.com
        password: '123456'
        nombre: Marta
        apellido: González
        telefono: '11-5555-1234'
        rol: CLIENTE
        fechaNacimiento: '2000-05-14'

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 6
      example:
        email: admin@test.com
        password: '123456'
      description: |
        Usuarios de prueba del seed:
        - ADMINISTRADOR: admin@test.com / 123456
        - CLIENTE: cliente@test.com / 123456

    ElementoPersonalizacion:
      type: object
      properties:
        precio:
          type: number
          format: double

    PersonalizacionInput:
      type: object
      properties:
        extras:
          type: array
          items:
            $ref: '#/components/schemas/ElementoPersonalizacion'
        acompanamientos:
          type: array
          items:
            $ref: '#/components/schemas/ElementoPersonalizacion'

    PedidoItemInput:
      type: object
      description: >-
        Una línea del pedido. Se requiere un identificador (productoId) o bien
        nombre + precio (nombre/nombreProducto y precio/precioUnitario).
      properties:
        productoId:
          type: integer
        nombre:
          type: string
        nombreProducto:
          type: string
        precio:
          type: number
          format: double
          minimum: 0
        precioUnitario:
          type: number
          format: double
          minimum: 0
        cantidad:
          type: integer
          minimum: 1
          default: 1
        observacion:
          type: string
        personalizacion:
          $ref: '#/components/schemas/PersonalizacionInput'
        extras:
          type: array
          items:
            $ref: '#/components/schemas/ElementoPersonalizacion'
        acompanamientos:
          type: array
          items:
            $ref: '#/components/schemas/ElementoPersonalizacion'

    DireccionEntregaInput:
      type: object
      description: Snapshot de la dirección de entrega que se persiste en el pedido
      properties:
        calle:
          type: string
        altura:
          type: integer
        ciudad:
          type: string
        codigoPostal:
          type: string
        referencia:
          type: string
        latitud:
          type: number
          format: double
        longitud:
          type: number
          format: double

    CrearPedidoRequest:
      type: object
      required:
        - productos
      properties:
        productos:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/PedidoItemInput'
        sucursalId:
          type: integer
          description: >-
            Opcional. Si se omite se asigna automáticamente la sucursal con
            menor carga de pedidos pendientes.
        direccionEntrega:
          $ref: '#/components/schemas/DireccionEntregaInput'
        costoEnvio:
          type: number
          format: double
          minimum: 0
          default: 0
        medioPago:
          $ref: '#/components/schemas/MedioPago'
        observacion:
          type: string

    CambiarEstadoRequest:
      type: object
      required:
        - estado
      properties:
        estado:
          $ref: '#/components/schemas/EstadoPedidoEnum'
          description: >-
            Transiciones permitidas: pendiente→confirmado|cancelado;
            confirmado→en_preparacion|cancelado;
            en_preparacion→listo_para_entregar;
            listo_para_entregar→en_camino; en_camino→entregado.
            Confirmar (pendiente→confirmado) solo lo puede hacer el CLIENTE
            dueño y exige medioPago; cancelar, el CLIENTE dueño o el
            ADMINISTRADOR; el resto de las transiciones solo ADMINISTRADOR.
        observacion:
          type: string
        medioPago:
          $ref: '#/components/schemas/MedioPago'
          description: Obligatorio al confirmar un pedido

    CategoriaRequest:
      type: object
      required:
        - nombre
      properties:
        nombre:
          type: string
        descripcion:
          type: string
        imagen:
          type: string
      example:
        nombre: Entradas
        descripcion: Picadas y aperitivos para compartir

    ProductoRequest:
      type: object
      required:
        - nombre
        - tipo
        - precio
      properties:
        nombre:
          type: string
        tipo:
          $ref: '#/components/schemas/TipoProducto'
        precio:
          type: number
          format: double
          minimum: 0
        categoria:
          type: string
          description: Nombre de la categoría (alternativa a categoriaId)
        categoriaId:
          type: integer
        imagen:
          type: string
        descripcion:
          type: string
      example:
        nombre: Picada para dos
        tipo: PRODUCTO
        precio: 8500
        categoria: Entradas
        descripcion: Tabla de fiambres y quesos para compartir

    SucursalRequest:
      type: object
      required:
        - nombre
        - direccion
      properties:
        nombre:
          type: string
        direccion:
          type: string
        latitud:
          type: number
          format: double
          minimum: -90
          maximum: 90
        longitud:
          type: number
          format: double
          minimum: -180
          maximum: 180
        telefono:
          type: string
        horarios:
          type: string
        activa:
          type: boolean
          default: true
      example:
        nombre: Sucursal Centro
        direccion: Av. Rivadavia 2100
        latitud: -34.6083
        longitud: -58.3812
        telefono: '11-5555-0001'
        horarios: Lun a Dom 10:00-23:00

    # Iteración 1-geo (direcciones y geolocalización): contrato del nuevo
    # flujo territorial. Obligatorios: calle, altura y provincia. En la
    # provincia de Buenos Aires el `departamento` (partido) es obligatorio
    # para desambiguar. `localidad` es opcional (la determina el backend con
    # Georef) y `codigoPostal` ya no se exige (Georef no lo provee).
    # latitud/longitud no se aceptan (las calcula el backend).
    DireccionRequest:
      type: object
      required:
        - calle
        - altura
        - provincia
      properties:
        calle:
          type: string
        altura:
          type: integer
          minimum: 0
        provincia:
          type: string
        departamento:
          type: string
          description: >-
            Partido (Buenos Aires) / comuna (CABA). Obligatorio cuando la
            provincia es Buenos Aires; opcional en el resto.
        localidad:
          type: string
          description: Opcional; si no se envía, el backend la determina con Georef.
        codigoPostal:
          type: string
          description: Opcional; Georef no provee códigos postales.
        referencia:
          type: string
        alias:
          type: string
      example:
        calle: General Villegas
        altura: 5329
        provincia: Buenos Aires
        departamento: Tres de Febrero
        referencia: 'Casa verde, 2da puerta'
        alias: Casa

    # Iteración 1-geo: respuesta 409 de direcciones ambiguas.
    DireccionOpcion:
      type: object
      properties:
        nomenclatura:
          type: string
        provincia:
          type: string
        departamento:
          type: string
        localidad:
          type: string
          nullable: true

    HealthData:
      type: object
      properties:
        success:
          type: boolean
          example: true
        servicio:
          type: string
        timestamp:
          type: string
          format: date-time

    CsrfData:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            csrfToken:
              type: string

    MensajeData:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            message:
              type: string

    ImagenData:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            url:
              type: string

    # ---------- Wrappers de respuesta ----------
    RespuestaUsuarioPublico:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: '#/components/schemas/UsuarioPublico'
    RespuestaListaUsuarios:
