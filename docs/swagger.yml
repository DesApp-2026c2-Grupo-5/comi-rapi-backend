  /direcciones:
    get:
      tags:
        - Direcciones
      summary: Lista direcciones
      description: >-
        Un CLIENTE ve sus direcciones activas. Un ADMINISTRADOR o un
        SUPERADMINISTRADOR ve las de cualquier usuario (apoya el detalle de
        cliente) filtrando por usuarioId y activa.
      operationId: direccionesIndex
      security:
        - cookieAuth: []
      parameters:
        - name: usuarioId
          in: query
          required: false
          description: Solo administradores y superadministradores
          schema:
            type: integer
        - name: activa
          in: query
          required: false
          description: Solo administradores y superadministradores (por defecto solo activas)
          schema:
            type: string
            enum:
              - 'false'
              - 'true'
      responses:
        '200':
          description: Listado de direcciones
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaListaDirecciones'
        '403':
          description: Acceso denegado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaError'
    post:
      tags:
        - Direcciones
      summary: Crea una dirección (solo CLIENTE)
      operationId: direccionesCreate
      security:
        - cookieAuth: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DireccionRequest'
      responses:
        '201':
          description: Dirección creada (geocodificada por el backend y con cobertura válida)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaDireccion'
        '400':
          description: Calle, altura o coordenadas inválidas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaError'
        '403':
          description: Acceso denegado o token CSRF inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaError'
        '409':
          description: >-
            Iteración 1-geo: la dirección coincide con varias ubicaciones
            (identidades territoriales distintas). La respuesta incluye
            `opciones` para que el usuario elija una y reintente agregando
            el `departamento` correspondiente
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  error:
                    type: string
                  opciones:
                    type: array
                    items:
                      $ref: '#/components/schemas/DireccionOpcion'
        '422':
          description: >-
            La dirección no es válida para delivery: no pudo ubicarse (no
            encontrada), está fuera de la zona de operación o no hay
            sucursales activas dentro de la distancia máxima
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/RespuestaError'
                  - type: object
                    description: >-
                      Iteración 5: en el rechazo por cobertura, `detalle`
                      expone la distancia de la sucursal activa más cercana
                      (metros) para explicar el motivo.
                    properties:
                      detalle:
                        type: object
                        nullable: true
                        properties:
                          distanciaMasCercanaMetros:
                            type: number
        '503':
          description: Servicio de geolocalización o rutas no disponible temporalmente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaError'

  /direcciones/{id}:
    get:
      tags:
        - Direcciones
      summary: Obtiene una dirección por id
      description: Solo el dueño, un administrador o un superadministrador.
      operationId: direccionesShow
      security:
        - cookieAuth: []
